services:
  api:
    build: .
    image: user-registration-api:latest
    ports:
      - "${PORT:-3000}:3000"
    environment:
      # Required — compose refuses to start if JWT_SECRET is unset.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_REGISTER_MAX: ${RATE_LIMIT_REGISTER_MAX:-10}
      RATE_LIMIT_LOGIN_MAX: ${RATE_LIMIT_LOGIN_MAX:-20}
      SQLITE_FILE: /app/data/users.sqlite
      PORT: 3000
    volumes:
      - userdata:/app/data
    restart: unless-stopped

volumes:
  userdata:
